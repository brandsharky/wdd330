<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="images/telematrix.svg">
  <title>Expand | Telematrix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/large.css">
  <link rel="stylesheet" href="styles/small.css">

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
  <script type="module" src="scripts/expand.js"></script>
</head>

<body>
  <header id="header"></header>



  <main>
    <section class="page-introduction">
      <h2>Share a Show Worth Adding</h2>
      <p>
        Know a <span>show</span> that should be <span>included</span>? <span>Use</span> this page to <span>suggest</span> a title and <span>share</span> your preferences. While submissions <span>won’t</span> instantly update the site, they help <span>build</span> a better <span>collection</span> and <span>reflect</span> what users are <span>interested</span> in.
      </p>
      </p>

      <img src="images/film.jpg" alt="Film Wheel" loading="lazy" width="1000" height="500">
    </section>


    <section class="expansion-form">
      <form id="contact-form">
        <div class="form-group">
          <label for="firstname">First Name*</label>
          <input type="text" id="firstname" name="firstname" placeholder="First name" autocomplete="given-name" required>
        </div>

        <div class="form-group">
          <label for="lastname">Last Name*</label>
          <input type="text" id="lastname" name="lastname" placeholder="Last name" autocomplete="family-name" required>
        </div>

        <div class="form-group">
          <label for="email">Email*</label>
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="showtitle">Show Title*</label>
          <input type="text" id="showtitle" name="showtitle" placeholder="Show Title" required>
        </div>

        <input type="hidden" name="timestamp" id="timestamp">

        <input type="submit" value="Expand Our Collection">
      </form>
    </section>
  </main>



  <footer id="footer"></footer>
</body>

</html>
